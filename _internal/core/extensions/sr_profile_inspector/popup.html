<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Inspector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      background: #11111b;
      color: #cdd6f4;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #313244;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }
    .badge {
      background: qlineargradient(x1:0, y1:0, x2:1, y2:0, stop:0 #7c3aed, stop:1 #3b82f6);
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
    }
    .card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a6adc8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 6px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #a6adc8;
    }
    .val {
      font-weight: 600;
      color: #ffffff;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 4px;
      box-shadow: 0 0 8px #10b981;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      background: #313244;
      border: 1px solid #45475a;
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #45475a;
      border-color: #8b5cf6;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      grid-column: span 2;
      padding: 9px;
      font-weight: 700;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #6c7086;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-title">srkBrowser</span>
    </div>
    <span class="badge" id="profBadge">#275</span>
  </div>

  <div class="card">
    <div class="card-title">🏷️ Profile Details</div>
    <div class="row">
      <span class="label">Name:</span>
      <span class="val" id="profName">Profile 275</span>
    </div>
    <div class="row">
      <span class="label">Group:</span>
      <span class="val" id="profGroup">Default</span>
    </div>
    <div class="row">
      <span class="label">Fingerprint:</span>
      <span class="val"><span class="status-dot"></span>Protected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🌐 Proxy & Network</div>
    <div class="row">
      <span class="label">Type:</span>
      <span class="val" id="proxyType">Direct</span>
    </div>
    <div class="row">
      <span class="label">Host:</span>
      <span class="val" id="proxyHost">None</span>
    </div>
    <div class="row">
      <span class="label">Status:</span>
      <span class="val" style="color: #4ade80;"><span class="status-dot"></span>Connected</span>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn btn-primary" id="btnCheckIP">🌐 Check My IP Address</button>
    <button class="btn" id="btnClearCache">🧹 Clear Cache</button>
    <button class="btn" id="btnWebRTC">🛡️ WebRTC Test</button>
  </div>

  <div class="footer">Isolated Profile Environment • srkBrowser v2.0</div>

  <script src="popup.js"></script>
</body>
</html>
